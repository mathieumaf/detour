name: Feature request
description: Something Detour should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, and where Detour falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. A rough idea is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead for now
