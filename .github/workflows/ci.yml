name: CI

# Everything a change has to pass before it can merge. `bun run check`,
# `bun run package` and `bun run test:e2e` run the same commands locally.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts CI on the release pull request this way: a pull request
  # opened by the workflow token does not trigger `pull_request` runs.
  workflow_dispatch:

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

      - name: Formatting
        run: bun run format:check

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test

  package:
    name: Store packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Builds and zips both browsers, then checks the packages the way the
      # release does. A release never meets these checks for the first time.
      - name: Build and check the store packages
        run: bun run package

      - name: Rebuild the Firefox package from the sources zip
        run: bun run package:verify

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-packages
          path: .output/*.zip
          # .output is a hidden directory, which the action skips by default.
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Puppeteer pins the browser builds it drives, so the lockfile decides
      # which Chrome and Firefox the suite runs against.
      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}

      - name: Install the browser
        run: bunx puppeteer browsers install ${{ matrix.browser }}

      - name: End-to-end tests
        run: bun run test:e2e:${{ matrix.browser }}

  # The one check branch protection requires. It passes only when every job
  # above passed, so adding or renaming a job never needs a settings change.
  gate:
    name: CI gate
    if: always()
    needs: [check, package, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not pass."
              exit 1
            fi
          done
