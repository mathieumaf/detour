name: Publish

# Builds the store packages for a released tag, attaches them to the GitHub
# Release, and submits the new version to Firefox Add-ons / Chrome Web Store.
# After zipping, scripts/normalize-zips.ts rewrites DOS timestamps so AMO
# accepts WXT 0.21 (zero-zip) packages. Invoked two ways:
#   - workflow_call: from release.yml right after a release is created.
#   - workflow_dispatch: manually, to (re)build and (re)submit an existing tag
#     — e.g. when an earlier auto-publish failed. skip_firefox skips AMO when
#     that version is already on Firefox (Chrome-only recovery).
# Overlay the zip normalizer and publish-browser-extension ≥6.1.1 from this
# workflow's revision so older tags can still be republished via
# workflow_dispatch (AMO FormData filename / pbe #91).

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and submit (e.g. detour-v1.1.0)
        type: string
        required: true
      skip_firefox:
        description: Skip Firefox Add-ons submit (Chrome-only republish)
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and submit (e.g. detour-v1.1.0)
        type: string
        required: true
      skip_firefox:
        description: Skip Firefox Add-ons submit (Chrome-only republish of a version AMO already has)
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Build & submit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Checkout uses the tag so the build matches the release, but older tags
      # (e.g. detour-v1.4.1) predate zip normalization. workflow_dispatch still
      # runs *this* workflow file from the selected branch (usually main), so
      # overlay the normalizer from github.sha. Future tags already contain it.
      - name: Overlay zip normalizer from workflow revision
        run: |
          mkdir -p scripts
          git fetch --depth 1 origin "${GITHUB_SHA}:refs/tmp/workflow-sha"
          git checkout refs/tmp/workflow-sha -- scripts/normalize-zips.ts
        env:
          GITHUB_SHA: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Checkout uses the tag, so older tags (e.g. detour-v1.4.2) still lock
      # publish-browser-extension@6.0.0. That version uploads zips as a FormData
      # blob with no filename; AMO parse_addon then rejects with
      # unsupported_filetype / "Upload is not valid". 6.1.0+ includes the
      # filename (pbe #91). Force-install so workflow_dispatch republishes pick
      # up the fix without rewriting the tag. Frozen install above still pins
      # everything else to the tag's lockfile.
      #
      # A root-only bun add is not enough: wxt submit loads
      # publish-browser-extension via node_modules/wxt/bin, and Bun will keep
      # a nested 6.0.0 there unless overrides force 6.1.1 everywhere.
      - name: Overlay publish-browser-extension 6.1.1
        run: |
          bun pm pkg set overrides.publish-browser-extension=6.1.1
          bun add -d publish-browser-extension@6.1.1

      - name: Build and zip both targets
        run: |
          bun run zip
          bun run zip:firefox
          bun scripts/normalize-zips.ts

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" .output/*.zip --clobber

      # Upload the new version to AMO. This only submits it; Mozilla's review
      # still gates when it goes live. Source zip is required (the build is bundled).
      # skip_firefox is for Chrome-only republish of a tag AMO already accepted
      # (re-submit would 400 "version already exists" and block Chrome).
      - name: Submit to Firefox Add-ons
        if: ${{ !inputs.skip_firefox }}
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: bun run submit:firefox

      # Upload the new version to the Chrome Web Store via API v2 (service
      # account). Like AMO, this only submits; Google's review still gates
      # when it goes live. CHROME_CANCEL_PENDING is always on so a leftover
      # pending CWS review does not fail publish (Firefox is fast; Chrome
      # pending would otherwise block recovery).
      #
      # v2 secrets must exist before merging a release-please PR (or before
      # workflow_dispatch republish): CHROME_EXTENSION_ID, CHROME_PUBLISHER_ID,
      # CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL, CHROME_SERVICE_ACCOUNT_PRIVATE_KEY.
      # v1.1 OAuth secrets (CHROME_CLIENT_ID / SECRET / REFRESH_TOKEN) are unused.
      - name: Submit to Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_CANCEL_PENDING: true
        run: |
          # GCP service-account JSON stores private_key with literal \n sequences.
          # Pasting that into a GitHub secret often keeps \n as two characters
          # (and surrounding quotes) instead of real PEM newlines. OpenSSL then
          # fails with ERR_OSSL_UNSUPPORTED (error:1E08010C:DECODER routines::unsupported).
          key="$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY"
          key="${key%\"}"; key="${key#\"}"
          key="${key//$'\\n'/$'\n'}"
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$key"
          bun run submit:chrome
