name: Release

# Takes a merged change to the Chrome Web Store and Firefox Add-ons.
#
#   push to main      release-please keeps a release pull request up to date.
#                     Merging that pull request tags the version and creates
#                     the GitHub release; the same run then builds the store
#                     packages and submits them.
#
#   run by hand       Publish an existing tag again, to one store or both, or
#                     check the store credentials without uploading anything.
#
# Each store has its own job. When one submission fails, re-run that job:
# the other store is not submitted twice. docs/releasing.md has the details.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again, like detour-v1.8.0. Leave empty for a dry run of main.
        type: string
        required: false
      store:
        description: Store to submit to
        type: choice
        options: [both, chrome, firefox]
        default: both
      dry_run:
        description: Check the store credentials only. Uploads nothing.
        type: boolean
        default: false

# release-please is not safe to run twice at once (two runs race to create the
# same tag), and a half-finished release must never be cancelled. Queue instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A pull request opened by the workflow token does not start workflows,
      # so the release pull request would wait for its required check forever.
      # Start CI on its branch explicitly.
      - name: Run CI on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          [ -n "$PRS" ] || exit 0
          echo "$PRS" | jq -r '.[].headBranchName' | while read -r branch; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done

  package:
    name: Build the store packages
    needs: [release-please]
    # Runs right after a release was created, or when started by hand.
    if: ${{ !cancelled() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check the request
        run: |
          if [ -z "$TAG" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Give the tag to publish, or tick dry_run."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG || github.sha }}

      - uses: ./.github/actions/setup

      - name: Check the tag matches the version
        if: env.TAG != ''
        run: |
          expected="detour-v$(jq -r .version package.json)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json, which says $expected."
            exit 1
          fi

      - name: Build and check the store packages
        run: bun run package

      - name: Rebuild the Firefox package from the sources zip
        run: bun run package:verify

      - name: Hand the packages to the store jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-packages
          path: .output/*.zip
          if-no-files-found: error

      - name: Attach the packages to the GitHub release
        if: env.TAG != '' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" .output/*.zip --clobber

  # Each submission only uploads the new version. The store's own review still
  # decides when it goes live.
  firefox:
    name: Submit to Firefox Add-ons
    needs: [release-please, package]
    if: ${{ !cancelled() && needs.package.result == 'success' && inputs.store != 'chrome' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag || github.sha }}

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-packages
          path: .output

      # Add-ons needs the sources zip too, because the build is bundled.
      - name: Submit
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            bun run submit:firefox --dry-run
          else
            bun run submit:firefox
          fi

  chrome:
    name: Submit to the Chrome Web Store
    needs: [release-please, package]
    if: ${{ !cancelled() && needs.package.result == 'success' && inputs.store != 'firefox' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag || github.sha }}

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-packages
          path: .output

      # Submits through the Chrome Web Store API v2 with a service account. A
      # review that is still pending is cancelled first, so it cannot block
      # the new version.
      - name: Submit
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          # The key was pasted from the service account JSON, where newlines
          # are the two characters "\n" and the value may still be quoted.
          # OpenSSL needs real newlines, so turn it back into a PEM here.
          key="$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY"
          key="${key%\"}"; key="${key#\"}"
          key="${key//$'\\n'/$'\n'}"
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$key"

          if [ "$DRY_RUN" = "true" ]; then
            bun run submit:chrome --dry-run
          else
            bun run submit:chrome
          fi
