name: Release

on:
  push:
    branches: [main]

# Serialize Release runs: release-please isn't safe to run concurrently (two
# overlapping runs race to create the same tag → "already_exists"). Never cancel
# a run mid-release — queue the next one so it sees the finished state instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Maintains a release PR (version bump + CHANGELOG). On merge it tags and
    # creates the GitHub Release; release_created flips true on that run.
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the store packages and ship them — only on the run that just created a
  # release. Lives in its own reusable workflow so it can also be re-run by hand
  # against an existing tag (publish.yml's workflow_dispatch).
  publish:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
