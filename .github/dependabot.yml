version: 2
updates:
  # GitHub Actions, in the workflows and in the shared setup action.
  #
  # `chore` is not a releasable type for release-please, so these bumps do not
  # cut a release. Do not set `include: scope` here: Dependabot would append
  # `(deps)` and the title would be the unparsable `chore(ci)(deps):`.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/setup'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns: ['*']

  # JavaScript dependencies (Bun reads package.json and bun.lock).
  #
  # Production updates (`dependencies`) are `fix(deps):`, which release-please
  # turns into a patch release, because they change what ships in the
  # extension. Development updates are `chore(deps-dev):`, which it ignores.
  # `include: scope` is what adds `(deps)` or `(deps-dev)`; the prefix itself
  # must not contain a scope or Dependabot appends a second one.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
    ignore:
      # A new TypeScript major has to be supported by vue-tsc and
      # typescript-eslint before `bun run typecheck` and `bun run lint` can use
      # it. Move to it by hand once both do, then keep this ignore for the next.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Minor and patch bumps of what ships in the extension (vue). Majors stay
      # ungrouped so each one is reviewed on its own. Kept apart from dev
      # dependencies: a grouped pull request is `fix(deps)` as soon as one
      # dependency in it is production, which would release dev-only bumps too.
      js-production-dependencies:
        dependency-type: 'production'
        patterns: ['*']
        update-types: ['minor', 'patch']
      # Dev-only bumps (wxt, vue-tsc, eslint, puppeteer, ...).
      js-development-dependencies:
        dependency-type: 'development'
        patterns: ['*']
        update-types: ['minor', 'patch']
