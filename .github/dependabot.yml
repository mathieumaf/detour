version: 2
updates:
  # GitHub Actions used in workflows (e.g. checkout, setup-bun).
  # `chore` is not a releasable type for release-please, so these bumps do not
  # cut a release. Do not set `include: scope` here: Dependabot would append
  # `(deps)` and the title would be the unparsable `chore(ci)(deps):`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  # JavaScript dependencies (Bun — reads package.json / bun.lock).
  #
  # Production updates (`dependencies`, and `optionalDependencies` if any)
  # are `fix(deps):`, which release-please turns into a patch. Development
  # updates are `chore(deps-dev):`, which it ignores. `include: scope` is
  # what adds `(deps)` vs `(deps-dev)`; the prefix itself must not contain
  # a scope or Dependabot appends a second one.
  #
  # `deps:` is not used. For release-type `node`, release-please only
  # releases feat, fix, perf, and revert. The `deps` type is not one of
  # them unless `changelog-sections` replaces the whole default list.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # vue-tsc 3.3.5 (latest) doesn't support TypeScript 6 yet — it loses the
      # global `chrome` types and breaks `bun run compile`. Hold at 5.x until a
      # TS6-compatible vue-tsc ships, then drop this ignore.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # package.json overrides (and publish.yml's "Overlay publish-browser-extension
      # 6.1.1" step, for republishing older tags) pin this to 6.1.1. The lockfile
      # therefore stays on 6.1.1 even though the devDependency range is ^6.2.0.
      # Dependabot still tries to install 6.2.0, Bun changes no files, and the bun
      # job dies with FileUpdater::NoChangeError. Drop this ignore when that exact
      # pin is removed. 6.0.0 omitted the AMO zip filename (pbe #91, fixed in
      # 6.1.0); 6.2.0 does not revert that, but it is not what publish runs and
      # has not been retested against AMO.
      - dependency-name: "publish-browser-extension"
    groups:
      # Minor/patch production bumps (shipped in the extension, e.g. vue).
      # Majors stay ungrouped so each one is reviewed on its own.
      # Kept separate from dev deps: a grouped PR is `fix(deps)` when any
      # dependency in it is production, which would also release dev-only bumps.
      js-production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Dev-only bumps (wxt, vue-tsc, types, vite, …) use chore(deps-dev).
      js-development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
