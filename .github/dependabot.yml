version: 2
updates:
  # GitHub Actions used in workflows (e.g. checkout, setup-bun).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # JavaScript dependencies (Bun — reads package.json / bun.lock).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # vue-tsc 3.3.5 (latest) doesn't support TypeScript 6 yet — it loses the
      # global `chrome` types and breaks `bun run compile`. Hold at 5.x until a
      # TS6-compatible vue-tsc ships, then drop this ignore.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all minor/patch bumps; majors stay separate for review.
      js-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
