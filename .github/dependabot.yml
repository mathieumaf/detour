version: 2
updates:
  # GitHub Actions used in workflows (e.g. checkout, setup-bun).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # JavaScript dependencies (Bun — reads package.json / bun.lock).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR for all minor/patch bumps; majors stay separate for review.
      js-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
