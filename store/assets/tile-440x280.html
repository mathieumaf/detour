<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="listing.css" />
    <style>
      body { width: 440px; height: 280px; }
      .stage {
        width: 440px;
        height: 280px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 34px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(180deg, #22c55e, #15803d);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 24px -8px rgba(8, 40, 24, 0.5);
        margin-bottom: 18px;
      }
      .h1 { font-size: 36px; }
      .sub { font-size: 16px; margin-top: 10px; max-width: 360px; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="copy">
        <div class="logo">
          <svg viewBox="0 0 128 128" width="36" height="36">
            <g fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
              <path d="M38 84 H72 V46" />
              <path d="M54 60 L72 42 L90 60" />
            </g>
            <circle cx="38" cy="84" r="9" fill="#fff" />
          </svg>
        </div>
        <div class="h1">Detour</div>
        <div class="sub">Switch proxies in one click — right from your toolbar.</div>
      </div>
    </div>
  </body>
</html>
